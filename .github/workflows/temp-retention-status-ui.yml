name: Apply retention and status UI patch

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Retry retention and status UI patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set +e
          python scripts/patch-retention-status-ui.py 2>patch-error.txt
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            grep -q "marker test block not found" patch-error.txt || { cat patch-error.txt; exit "$status"; }
          fi
          python scripts/finalize-retention-status-tests.py
      - name: Run focused tests
        run: |
          node --test test/issues.test.js
          node --test test/chat-kanji-preview.test.js
          node --test test/value-lock-visual.test.js
      - name: Remove temporary patch files
        run: rm .github/workflows/temp-retention-status-ui.yml scripts/patch-retention-status-ui.py scripts/finalize-retention-status-tests.py patch-error.txt
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+yak9909@users.noreply.github.com
          git add -A
          git commit -m "Revise retention indicators and menu hints"
          git push
