name: Apply checkbox-list setting

on:
  push:
    branches: [main]
    paths:
      - 'tools/temp-checkbox-list-setting.py'
      - '.github/workflows/temp-checkbox-list-setting.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply checkbox-list patch
        run: python tools/temp-checkbox-list-setting.py
      - name: Run tests
        run: npm test
      - name: Remove temporary files
        run: |
          rm tools/temp-checkbox-list-setting.py
          rm .github/workflows/temp-checkbox-list-setting.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add checkbox-list button blocking setting'
          git push
