name: Apply corrected ACNL kana glyphs

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace misaligned extra BCFNT glyphs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          path = Path('chat-kanji-preview.js')
          text = path.read_text(encoding='utf-8')
          block = base64.b64decode('').decode('utf-8')
          pattern = r'  const EXTRA_GLYPHS = Object\.freeze\(\{.*?\n  \}\);\n\n  const PREVIEW_CANDIDATES'
          text, count = re.subn(pattern, block + '\n\n  const PREVIEW_CANDIDATES', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('EXTRA_GLYPHS block not found')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/temp-kana-glyph-fix.yml
      - name: Commit corrected glyphs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chat-kanji-preview.js .github/workflows/temp-kana-glyph-fix.yml
          git commit -m "Correct ACNL kana glyph cell extraction"
          git push
