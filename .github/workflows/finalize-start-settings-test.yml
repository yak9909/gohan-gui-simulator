name: Align START settings test

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path('test/app.test.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
            'assert.match(html, /<b>START<\\/b> お気に入り開閉/);',
            'assert.match(html, /<b>START<\\/b> 設定/);'
          )
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/finalize-start-settings-test.yml').unlink()
      - name: Commit update
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/app.test.js .github/workflows/finalize-start-settings-test.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align START settings regression test"
          git push
