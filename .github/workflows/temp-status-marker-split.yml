name: Apply vertically split status markers

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run vertical status marker patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply marker layout patch
        run: python tools/temp-status-marker-split.py
      - name: Run tests
        run: npm test
      - name: Remove temporary files
        run: rm .github/workflows/temp-status-marker-split.yml tools/temp-status-marker-split.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use vertically split status markers"
          git push
