name: Finalize issue resolutions

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused updates
        shell: python
        run: |
          from pathlib import Path

          test = Path('test/app.test.js')
          text = test.read_text(encoding='utf-8')
          text = text.replace('assert.equal(font.glyphCount, 370);', 'assert.equal(font.glyphCount, 385);')
          test.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
            '- お気に入り機能を搭載。Rで選択Itemを登録／解除し、STARTで`FAVORITES`仮想フォルダを開閉する。FAVORITES内のフォルダへ入っていてもSTARTで呼び出し元へ戻れる。Bで戻る操作も従来どおり使用可能。お気に入り一覧は元Itemそのものを参照するため、ON/OFF・値・適用待ち・ホットキー状態が常に共有される',
            '- STARTで`SETTINGS`を開閉し、その中の`FAVORITES`からお気に入り一覧を開く。Rで選択Itemを登録／解除する。お気に入り一覧は元Itemそのものを参照するため、ON/OFF・値・適用待ち・ホットキー状態が常に共有される'
          )
          text = text.replace(
            '- 変更されたItemは黄色で表示。X短押しで選択Itemだけを適用し、Xを600ms長押しすると進捗バー完了後に全項目適用の確認ダイアログを表示',
            '- 変更されたItemは黄色で表示。X短押しで選択Itemだけを適用。X/L長押しは600msで全適用／全戻し確認へ進み、進捗2/5未満は灰色、2/5以上600ms未満で離した場合は単体操作も行わず長押しだけをキャンセル'
          )
          text = text.replace(
            '- 連動型は`S`＋水色と説明欄の`SYNC`表示で通常項目と区別。トグル型アクションは通常アクションと同じ見た目にし、ON/OFF値で状態を示す',
            '- 連動型は`S`＋水色と説明欄の`SYNC`表示で通常項目と区別。STARTの`SETTINGS`には選択中の連動型数値／リストを現在値へ固定する`VALUE LOCK`を表示し、変更不可状態では新規固定を禁止。トグル型アクションは通常アクションと同じ見た目にし、ON/OFF値で状態を示す'
          )
          text = text.replace(
            '- 全チートItemのホットキー設定と無効化。入力待ちウィンドウはタッチ可能な下画面へ表示し、Yを離した後のボタン入力を全ボタンが離された時点で重複なしの組み合わせとして確定',
            '- 全チートItemのホットキー設定と無効化。無効Itemは灰色表示のままカーソル選択と説明確認は可能だが、値変更・決定・適用・ホットキー設定は不可。入力待ちウィンドウはタッチ可能な下画面へ表示し、Yを離した後のボタン入力を全ボタンが離された時点で重複なしの組み合わせとして確定'
          )
          text = text.replace(
            'RがR（メニュー内ではお気に入り切替）、EがZL、TがZR、1がSELECT、2がSTART（メニュー内ではお気に入り一覧）です。',
            'RがR（メニュー内ではお気に入り切替）、EがZL、TがZR、1がSELECT、2がSTART（メニュー内では設定画面の開閉）です。'
          )
          readme.write_text(text, encoding='utf-8')

          Path('.github/workflows/finalize-issues.yml').unlink()
      - name: Commit updates
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md test/app.test.js .github/workflows/finalize-issues.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize resolved issue behavior"
          git push
