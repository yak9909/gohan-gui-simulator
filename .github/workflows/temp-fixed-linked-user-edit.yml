name: Apply fixed linked user edit update

on:
  push:
    branches: [main]
    paths:
      - 'tools/temp-fixed-linked-user-edit.py'
      - '.github/workflows/temp-fixed-linked-user-edit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Adjust regression timing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/temp-fixed-linked-user-edit.py')
          text = p.read_text(encoding='utf-8')
          old = '''  const weather = findItem(menu, "天候");'''
          new = '''  menu.update(300);\n  assert.equal(menu.overlay, null, "numeric overlay finishes closing before normal menu input resumes");\n\n  const weather = findItem(menu, "天候");'''
          if text.count(old) != 1:
              raise SystemExit('expected one weather test marker')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Apply fixed linked edit patch
        run: python tools/temp-fixed-linked-user-edit.py
      - name: Run tests
        run: npm test
      - name: Remove temporary files
        run: |
          rm tools/temp-fixed-linked-user-edit.py
          rm .github/workflows/temp-fixed-linked-user-edit.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Allow fixed linked user edits and list stepping'
          git push
