name: Apply semi-transparent status marker update

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run semi-transparent status marker patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply marker alpha patch
        run: python tools/temp-status-alpha.py
      - name: Run tests
        run: npm test
      - name: Remove temporary files
        run: rm tools/temp-status-alpha.py .github/workflows/temp-status-alpha.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Render status markers semi-transparent"
          git push
