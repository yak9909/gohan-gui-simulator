name: Apply item retain marker update

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run item retain marker patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply marker patch
        run: python tools/temp-item-retain-marker.py
      - name: Run tests
        run: npm test
      - name: Remove temporary files
        run: rm tools/temp-item-retain-marker.py .github/workflows/temp-item-retain-marker.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use 1px red item-retain markers"
          git push
