name: Apply settings checkbox immediate-apply and title

on:
  push:
    branches: [main]
    paths:
      - 'tools/temp-settings-checkbox-immediate-title.py'
      - '.github/workflows/temp-settings-checkbox-immediate-title.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python tools/temp-settings-checkbox-immediate-title.py
      - name: Run tests
        run: npm test
      - name: Remove temporary files
        run: |
          rm tools/temp-settings-checkbox-immediate-title.py
          rm .github/workflows/temp-settings-checkbox-immediate-title.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply settings checkbox lists immediately and rename menu title'
          git push
