name: Finalize ACNL chat preview assets

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'Finalize ACNL chat preview data')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble generated preview data
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .chat-preview-parts/chatdata.part.00)" -eq 8000
          test "$(wc -c < .chat-preview-parts/chatdata.part.01)" -eq 8000
          test "$(wc -c < .chat-preview-parts/chatdata.part.02)" -eq 8000
          test "$(wc -c < .chat-preview-parts/chatdata.part.03)" -eq 8000
          test "$(wc -c < .chat-preview-parts/chatdata.part.04)" -eq 8000
          test "$(wc -c < .chat-preview-parts/chatdata.part.05)" -eq 1735
          cat .chat-preview-parts/chatdata.part.* > chat-kanji-preview-data.js
          printf '%s  %s\n' '35e1e736b10df7b0718989ded46d49607299908475d235ccc6559794a4e78b5f' chat-kanji-preview-data.js | sha256sum -c -
      - name: Remove staging data and workflow
        shell: bash
        run: |
          rm -rf .chat-preview-parts
          rm .github/workflows/chat-preview-build.yml
      - name: Commit generated asset
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add ACNL chat preview source data"
          git push origin HEAD:main
