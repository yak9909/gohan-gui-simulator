name: Apply hotkey status order update

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run hotkey status order patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply status order patch
        run: python tools/temp-hotkey-status-order.py
      - name: Run tests
        run: npm test
      - name: Remove temporary files
        run: rm tools/temp-hotkey-status-order.py .github/workflows/temp-hotkey-status-order.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Place hotkey status segment last"
          git push
