name: Apply measured kanji preview layout

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply measured layout patches
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 < .github/patches/chat-layout-1.patch
          patch -p1 < .github/patches/chat-layout-2.patch
          patch -p1 < .github/patches/chat-layout-3.patch
          patch -p1 < .github/patches/chat-layout-4.patch
          patch -p1 < .github/patches/chat-layout-meta.patch
          node -c chat-kanji-preview.js
          node --test test/chat-kanji-preview.test.js
          git diff --check
      - name: Remove temporary patch files
        run: rm -rf .github/patches .github/workflows/temp-measured-kanji-layout.yml
      - name: Commit corrected preview
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chat-kanji-preview.js test/chat-kanji-preview.test.js README.md .github/patches .github/workflows/temp-measured-kanji-layout.yml
          git commit -m "Align kanji preview to measured ACNL layout"
          git push origin HEAD:main
