name: Test simulator

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test issue 2
        continue-on-error: true
        run: node --test --test-name-pattern="issue #2" test/issues.test.js
      - name: Test issue 3
        continue-on-error: true
        run: node --test --test-name-pattern="issue #3" test/issues.test.js
      - name: Test issue 4
        continue-on-error: true
        run: node --test --test-name-pattern="issue #4" test/issues.test.js
      - name: Test issue 5
        continue-on-error: true
        run: node --test --test-name-pattern="issue #5" test/issues.test.js
      - name: Run full tests
        run: npm test
