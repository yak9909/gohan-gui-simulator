name: Apply 2px status marker width

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run 2px status marker patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply width patch
        run: python tools/temp-status-marker-width.py
      - name: Run tests
        run: npm test
      - name: Remove temporary files
        run: rm tools/temp-status-marker-width.py .github/workflows/temp-status-marker-width.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use 2px status markers extending left"
          git push
