name: Finalize chat preview documentation

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'Document ACNL chat preview')
    steps:
      - uses: actions/checkout@v4
      - name: Update README
        shell: python
        run: |
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('ルート20項目・スクロールテストフォルダ24項目を収録し、10行表示で選択追従スクロール', 'ルートメニュー・スクロールテストフォルダ24項目を収録し、10行表示で選択追従スクロール')
          marker = '## 下画面UI\n\n'
          bullet = ('- `漢字変換プレビュー`をONにしてX適用すると、添付されたとび森チャット画面を下画面へ320×240で表示し、入力欄直下の空き領域（Y=47〜65）へ変換候補 `漢字 / 感じ / 幹事 / 完治` を描画。候補文字は添付`Garden_msg_size16.bcfnt`のA4字形から必要文字だけを抽出して1px単位で描画し、Canvasの`fillText`やブラウザフォントは使用しない。操作可能な下画面UIが開いている間は既存UIを優先する\n')
          if bullet not in text:
              if marker not in text: raise SystemExit('README marker not found')
              text = text.replace(marker, marker + bullet, 1)
          path.write_text(text, encoding='utf-8')
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/chat-preview-docs-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Document ACNL chat kanji preview"
          git push origin HEAD:main
