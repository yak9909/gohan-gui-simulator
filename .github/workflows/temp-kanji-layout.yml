name: Apply integrated kanji input controls

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch-kanji-layout.py
      - name: Remove temporary patch files
        run: rm .github/workflows/temp-kanji-layout.yml scripts/patch-kanji-layout.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chat-kanji-preview.js test/chat-kanji-preview.test.js .github/workflows/temp-kanji-layout.yml scripts/patch-kanji-layout.py
          git commit -m "Integrate kanji conversion and input controls"
          git push
