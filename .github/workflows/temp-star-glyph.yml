name: Add footer star glyph

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Apply footer star glyph fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add star glyph
        run: python scripts/add-footer-star-glyph.py
      - name: Run tests
        run: npm test
      - name: Remove temporary patch files
        run: rm .github/workflows/temp-star-glyph.yml scripts/add-footer-star-glyph.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add footer star glyph"
          git push
